# application-docker.yaml
#
# Profile activated inside Docker containers.
# Uses Docker network hostnames instead of localhost.

spring:
  datasource:
    url: jdbc:postgresql://database:5432/gymdb
    username: replog_app
    password: replog_app

  flyway:
    url: jdbc:postgresql://database:5432/gymdb
    user: gym
    password: gym

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false

app:
  cors:
    allowed-origins:
      - http://localhost:8082
      - http://localhost:5500
      - http://localhost:5173
      - https://gym.made-simple.online
  migration:
    redirect-base-url: https://gym.made-simple.online/migrate
    token-ttl-hours: 48
    cleanup-cron: "0 0 3 * * *"
    rate-limit:
      migrate-capacity: 10
      migrate-period-hours: 1
      claim-capacity: 15
      claim-period-minutes: 1
