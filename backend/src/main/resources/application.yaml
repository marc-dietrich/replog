spring:
  application:
    name: replog

  datasource:
    url: jdbc:postgresql://localhost:15432/gymdb
    username: replog_app
    password: replog_app

  flyway:
    url: jdbc:postgresql://localhost:15432/gymdb
    user: gym
    password: gym
    locations: classpath:db/migration

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:8081/realms/replog

app:
  health:
    db-timeout-seconds: 3
  cors:
    allowed-origins:
      - http://localhost:5500
      - http://localhost:5173
    allowed-methods:
      - GET
      - POST
      - PUT
      - DELETE
      - OPTIONS