spring:
  application:
    name: replog

  datasource:
    url: jdbc:postgresql://localhost:15432/gymdb
    username: replog_app
    password: replog_app

  flyway:
    url: jdbc:postgresql://localhost:15432/gymdb
    user: gym
    password: gym
    locations: classpath:db/migration

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true

app:
  health:
    db-timeout-seconds: 3
  cors:
    allowed-origins:
      - http://localhost:5500
      - http://localhost:5173
      - https://marc-dietrich.github.io
    allowed-methods:
      - GET
      - POST
      - PUT
      - DELETE
      - OPTIONS
  migration:
    redirect-base-url: http://localhost:5173/migrate
    token-ttl-hours: 48
    cleanup-cron: "0 0 3 * * *"
    rate-limit:
      migrate-capacity: 10
      migrate-period-hours: 1
      claim-capacity: 15
      claim-period-minutes: 1