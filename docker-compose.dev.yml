version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    container_name: gym-tracker-db-dev
    environment:
      POSTGRES_DB: gym_tracker
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_INITDB_ARGS: "--encoding=UTF8"
    ports:
      - "5432:5432"
    volumes:
      - postgres_dev_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - gym-tracker-dev

  redis:
    image: redis:7-alpine
    container_name: gym-tracker-redis-dev
    ports:
      - "6379:6379"
    volumes:
      - redis_dev_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - gym-tracker-dev

volumes:
  postgres_dev_data:
  redis_dev_data:

networks:
  gym-tracker-dev:
    driver: bridge
