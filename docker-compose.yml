version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    container_name: gym-tracker-db
    environment:
      POSTGRES_DB: ${DATABASE_NAME:-gym_tracker}
      POSTGRES_USER: ${DATABASE_USER:-user}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:-password}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DATABASE_USER:-user}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - gym-tracker

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: gym-tracker-backend
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://user:password@postgres:5432/gym_tracker}
      DATABASE_ECHO: ${DATABASE_ECHO:-false}
      SECRET_KEY: ${SECRET_KEY:-your-secret-key-change-in-production-at-least-32-characters}
      ALGORITHM: ${ALGORITHM:-HS256}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-1440}
      DEBUG: ${DEBUG:-false}
      ENVIRONMENT: ${ENVIRONMENT:-development}
      CORS_ORIGINS: ${CORS_ORIGINS:-["http://localhost:5173","http://localhost:3000"]}
      MIGRATION_TOKEN_EXPIRY_DAYS: ${MIGRATION_TOKEN_EXPIRY_DAYS:-7}
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./backend/app:/app/app
    networks:
      - gym-tracker

volumes:
  postgres_data:

networks:
  gym-tracker:
    driver: bridge
