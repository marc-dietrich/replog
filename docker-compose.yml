services:
  caddy:
    image: caddy:2.8.4-alpine
    container_name: replog-caddy
    restart: unless-stopped
    ports:
      - "8082:80"
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

  frontend:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        APP_VERSION: ${APP_VERSION:-dev}
    container_name: replog-frontend
    restart: unless-stopped

  backend:
    image: replog-backend:latest
    container_name: replog-backend
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: docker
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      database:
        condition: service_started

  database:
    image: postgres:16-alpine
    container_name: replog-postgres
    ports:
      - "15432:5432"
    restart: unless-stopped
    environment:
      POSTGRES_USER: gym
      POSTGRES_PASSWORD: gym
      POSTGRES_DB: gymdb
    volumes:
      - replog-pgdata:/var/lib/postgresql/data

  backup:
    image: postgres:16-alpine
    container_name: replog-backup
    restart: unless-stopped
    entrypoint: ["/bin/sh", "/scripts/backup-scheduler.sh"]
    environment:
      BACKUP_DIR: /backups
      DB_HOST: database
      DB_PORT: "5432"
      DB_USER: gym
      DB_NAME: gymdb
      DB_PASSWORD: gym
      REMOTE_USER: ""       # fill in: your Raspi SSH user
      REMOTE_HOST: ""        # fill in: your Raspi IP/hostname
      REMOTE_PATH: ""        # fill in: /path/to/backups/on/raspi
    volumes:
      - ./scripts:/scripts:ro
      - replog-backups:/backups
      - ~/.ssh/id_rsa:/root/.ssh/id_rsa:ro
      - ~/.ssh/known_hosts:/root/.ssh/known_hosts:ro
      - ~/.ssh/config:/root/.ssh/config:ro
    depends_on:
      - database

volumes:
  caddy_data:
  caddy_config:
  replog-pgdata:
  replog-backups:
